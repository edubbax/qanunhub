# QanunHub on http://localhost:8080 against your Supabase project (database + auth).
#   cp .env.example .env   # fill in SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, DATABASE_URL
#   docker compose up --build
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
